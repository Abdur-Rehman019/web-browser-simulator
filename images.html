<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Kaizen Image Search."
    >

    <title>Kaizen Images</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- CSS-only dark mode -->
    <input
        type="checkbox"
        id="theme-toggle"
        class="theme-toggle"
    >


    <div class="site">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">

                <a href="index.html" class="brand-link">

                    <span class="brand-mark">
                        K
                    </span>

                    <span class="brand-name">
                        Kaizen
                    </span>

                </a>

            </div>


            <nav
                class="navigation"
                aria-label="Main navigation"
            >

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Web
                </a>

                <a
                    href="images.html"
                    class="nav-link active"
                >
                    Images
                </a>

                <a
                    href="advanced.html"
                    class="nav-link"
                >
                    Advanced
                </a>

                <label
                    for="theme-toggle"
                    class="theme-button"
                    title="Toggle dark mode"
                >
                    <span class="sun">☀</span>
                    <span class="moon">☾</span>
                </label>

            </nav>

        </header>


        <!-- ================= MAIN ================= -->

        <main class="search-page">

            <div class="page-heading">

                <div class="page-mark image-mark">
                    ◈
                </div>

                <div>

                    <h1>
                        Kaizen Images
                    </h1>

                    <p>
                        Discover images from across the web.
                    </p>

                </div>

            </div>


            <!-- ================= IMAGE SEARCH ================= -->

            <div class="large-search-area">

                <form
                    action="https://www.google.com/search"
                    method="get"
                    class="search-form"
                >

                    <div class="search-box-wrapper large">

                        <span
                            class="search-symbol"
                            aria-hidden="true"
                        >
                            ⌕
                        </span>


                        <label
                            for="image-search"
                            class="visually-hidden"
                        >
                            Search images
                        </label>


                        <input
                            id="image-search"
                            type="search"
                            name="q"
                            class="search-input"
                            placeholder="Search for images..."
                            autocomplete="off"
                            spellcheck="false"
                        >


                        <span
                            class="keyboard-hint"
                            aria-hidden="true"
                        >
                            /
                        </span>

                    </div>


                    <!-- IMPORTANT:
                         This MUST be inside the form.
                         tbm=isch tells Google to open Image Search.
                    -->

                    <input
                        type="hidden"
                        name="tbm"
                        value="isch"
                    >


                    <div class="search-actions">

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Search Images
                        </button>

                    </div>

                </form>

            </div>


            <!-- ================= INFO CARD ================= -->

            <section class="info-card">

                <div class="info-card-icon">
                    ◈
                </div>

                <div>

                    <h2>
                        Explore visually
                    </h2>

                    <p>
                        Search for photographs, illustrations,
                        designs, places, products, and more.
                    </p>

                </div>

            </section>

        </main>


        <!-- ================= FOOTER ================= -->

        <footer class="footer">

            <div class="footer-brand">

                <span class="footer-mark">
                    K
                </span>

                <span>
                    Kaizen Search
                </span>

            </div>


            <div class="footer-links">

                <a href="index.html">
                    Web Search
                </a>

                <a href="advanced.html">
                    Advanced Search
                </a>

                <a href="#">
                    Help
                </a>

            </div>


            <div class="footer-note">
                Search better.
            </div>

        </footer>

    </div>

</body>

</html>
